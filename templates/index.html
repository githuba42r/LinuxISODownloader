<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux ISO Torrent Updater</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Linux ISO Torrent Updater</h1>
        
        <!-- Messages container -->
        <div id="message-container"></div>
        
        <!-- Manager Status -->
        <div class="card">
            <h2>Manager Status</h2>
            <div id="manager-status">
                <span class="status status-idle">Loading...</span>
            </div>
        </div>
        
        <!-- Distribution Selection -->
        <div class="card">
            <h2>Select Distributions</h2>
            <div class="distro-grid" id="distros-container">
                <!-- Dynamically populated -->
            </div>
            <div class="button-group">
                <button id="select-all-btn" class="btn-secondary">Select All</button>
                <button id="check-updates-btn" class="btn-primary">Check for Updates</button>
            </div>
        </div>
        
        <!-- Check Results -->
        <div class="card">
            <h2>Results</h2>
            <div id="results-container">
                <p>No results yet. Select distributions and click "Check for Updates".</p>
            </div>
        </div>
        
        <!-- Active Torrents -->
        <div class="card">
            <h2>Active Torrents</h2>
            <div id="torrents-list">
                <p>Loading torrents...</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
