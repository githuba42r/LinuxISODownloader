version: '3.8'

services:
  # Web interface service (for GUI management)
  web-interface:
    build:
      context: .
      dockerfile: Dockerfile
    image: linux-iso-updater:latest
    container_name: linux-iso-updater-web
    
    # Port mapping for web interface
    ports:
      - "${WEB_PORT:-8084}:8084"
    
    # Network configuration - use host network to access local Transmission
    # Comment out ports above if using host network
    # network_mode: host
    
    # Load environment from .env.local file (RECOMMENDED)
    env_file:
      - .env.local
    
    # Environment variables can be overridden here if needed
    # Uncomment and modify as needed:
    # environment:
    #   - SCHEDULE_TIME=03:00
    #   - SCHEDULE_DISTROS=debian,ubuntu
    
    # Start in web mode
    command: ["--web"]
    
    # Restart policy for web interface (keep running)
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # CLI service (for one-time or scheduled updates)
  linux-iso-updater:
    build:
      context: .
      dockerfile: Dockerfile
    image: linux-iso-updater:latest
    container_name: linux-iso-updater
    
    # Network configuration - use host network to access local Transmission
    network_mode: host
    
    # Option 1: Load environment variables from .env file (RECOMMENDED)
    # Uncomment and create .env file with your credentials:
    # env_file:
    #   - .env
    
    # Option 2: Specify environment variables directly (for testing/quick runs)
    environment:
      - TRANSMISSION_HOST=${TRANSMISSION_HOST:-localhost}
      - TRANSMISSION_PORT=${TRANSMISSION_PORT:-9091}
      - TRANSMISSION_USER=${TRANSMISSION_USER}
      - TRANSMISSION_PASS=${TRANSMISSION_PASS}
      - DISTROS=${DISTROS:-debian,ubuntu,arch,raspberrypi}
    
    # Option 3: Mount .env files from host (alternative)
    # volumes:
    #   - ./.env:/app/.env:ro
    #   - ./.env.local:/app/.env.local:ro
    
    # Option 4: Mount config.json (alternative to .env)
    # volumes:
    #   - ~/.config/linux-iso-updater:/root/.config/linux-iso-updater:ro
    
    # Option 5: Mount log directory to persist logs on host
    # volumes:
    #   - ./logs:/logs
    
    # Command line arguments (uncomment to use)
    # command: []                    # Default: update all configured torrents
    # command: ["--dry-run"]         # Dry-run mode
    # command: ["--distro", "debian"] # Update specific distro only
    # command: ["--distros", "debian,ubuntu,raspberrypi"] # Update multiple distros
    # command: ["--dry-run", "--distro", "ubuntu"] # Dry-run for specific distro
    # command: ["--log-file", "/logs/updater.log", "--dry-run"] # With logging
    
    # Restart policy (for one-time runs, use 'no'; for daemon mode, use 'unless-stopped')
    restart: "no"
    
    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Example configurations:

# 1. Start web interface:
# docker-compose up web-interface

# 2. Start web interface in background:
# docker-compose up -d web-interface

# 3. Basic CLI usage with .env file (uncomment to use):
# docker-compose up linux-iso-updater

# 4. CLI Dry-run mode:
# docker-compose run --rm linux-iso-updater --dry-run

# 5. Update specific distro via CLI:
# docker-compose run --rm linux-iso-updater --distro raspberrypi

# 6. Override environment variables:
# DISTROS=debian,ubuntu docker-compose up linux-iso-updater

# 7. CLI with logging to host filesystem:
# Uncomment the volumes section for logs and run:
# docker-compose run --rm linux-iso-updater --log-file /logs/updater.log

# 8. Access web interface:
# Open http://localhost:8084 in your browser

